<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css.css">
</head>
<body>

<div class="page">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <img
      src="https://images.unsplash.com/photo-1767650563433-69ccbaa44a24?q=80&w=500&auto=format&fit=crop"
      alt="Profile Photo"
      class="profile-img"
    >
    <h2>MyProfile</h2>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="content">

    <section class="card">
      <h2>About Me</h2>
      <ul>
        <li>BSIT Student</li>
        <li>Aspiring Entrepreneur</li>
        <li>Gamer & Tech Enthusiast</li>
      </ul>
    </section>

    <section class="card">
      <h2>Skills</h2>
      <ul>
        <li>JavaScript</li>
        <li>Python</li>
        <li>SQL</li>
        <li>HTML & CSS</li>
      </ul>
    </section>

    <section class="card">
      <h2>My Gallery</h2>
      <div class="gallery">
        <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=500">
        <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500">
        <img src="https://images.unsplash.com/photo-1526378722484-bd91ca387e72?w=500">
      </div>
    </section>

  </main>

</div>

</body>
</html>
