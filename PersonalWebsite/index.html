<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css.css">
</head>
<body>

<div class="page">

  <aside class="sidebar">
    <img
      src="https://images.unsplash.com/photo-1767650563433-69ccbaa44a24?q=80&w=735&auto=format&fit=crop"
      alt="Profile Photo"
      class="profile-img"
    >
    <h2>MyProfile</h2>
  </aside>

  <main class="content">

    <section class="card">
      <h2>About Me</h2>
      <ul>
        <li>BSIT Student</li>
        <li>Aspiring Entrepreneur</li>
        <li>Gamer & Tech Enthusiast</li>
      </ul>
    </section>

    <section class="card">
      <h2>Skills</h2>
      <ul>
        <li>JavaScript</li>
        <li>Python</li>
        <li>SQL</li>
        <li>HTML & CSS</li>
      </ul>
    </section>

    <section class="card">
      <h2>My Gallery</h2>
      <div class="gallery">
        <img src="https://images.unsplash.com/photo-1767652634125-5014a5f3814c?q=80&w=735&auto=format&fit=crop">
        <img src="https://images.unsplash.com/photo-1767652634254-7e2f3b3e5d74?q=80&w=1074&auto=format&fit=crop">
        <img src="https://images.unsplash.com/photo-1767652634260-34c7aa1efa8e?q=80&w=735&auto=format&fit=crop">
      </div>
    </section>

  </main>

</div>

</body>
</html>
