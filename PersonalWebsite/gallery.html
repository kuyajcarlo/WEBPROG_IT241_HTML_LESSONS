    <!-- Image Modal for Lightbox -->
    <div id="imgModal" class="img-modal">
        <button class="modal-close" aria-label="Close">&times;</button>
        <button class="modal-nav modal-prev" aria-label="Previous">
            <i class="bi bi-chevron-left"></i>
        </button>
        <img id="modalImg" src="" alt="Gallery Image">
        <button class="modal-nav modal-next" aria-label="Next">

        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Gallery JavaScript -->
    <script>
        // Get all photo cards and modal elements
        const photoCards = Array.from(document.querySelectorAll('.photo-card'));
        const modal = document.getElementById('imgModal');
        const modalImg = document.getElementById('modalImg');
        const closeBtn = modal.querySelector('.modal-close');
        const nextBtn = modal.querySelector('.modal-next');
        const prevBtn = modal.querySelector('.modal-prev');
        let currentIndex = 0;
        let visibleCards = photoCards;

        // Open modal function
        function openModal(index) {
            currentIndex = index;
            const imgSrc = visibleCards[index].querySelector('img').src;
            modalImg.src = imgSrc;
            modal.classList.add('open');
        }

        // Close modal function
        function closeModal() {
            modal.classList.remove('open');
        }

        // Next image function
        function showNextImage() {
            currentIndex = (currentIndex + 1) % visibleCards.length;
            openModal(currentIndex);
        }

        // Previous image function
        function showPrevImage() {
            currentIndex = (currentIndex - 1 + visibleCards.length) % visibleCards.length;
            openModal(currentIndex);
        }

        // Add click event to each photo card
        photoCards.forEach((card, index) => {
            card.addEventListener('click', function() {
                // Update visible cards based on current filter
                visibleCards = Array.from(document.querySelectorAll('.photo-card')).filter(c => c.style.display !== 'none');
                const cardIndex = visibleCards.indexOf(card);
                openModal(cardIndex);
            });
        });

        // Close button click event
        closeBtn.addEventListener('click', closeModal);

        // Next button click event
        nextBtn.addEventListener('click', showNextImage);

        // Previous button click event
        prevBtn.addEventListener('click', showPrevImage);

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (!modal.classList.contains('open')) return;

            if (e.key === 'ArrowRight') {
                showNextImage();
            } else if (e.key === 'ArrowLeft') {
                showPrevImage();
            } else if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Click outside modal to close
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeModal();
            }
        });

        // Filter functionality
        const filterButtons = document.querySelectorAll('.filter-btn');
        
        filterButtons.forEach(button => {
            button.addEventListener('click', function() {
                // Remove active class from all buttons
                filterButtons.forEach(btn => btn.classList.remove('active'));
                
                // Add active class to clicked button
                this.classList.add('active');
                
                // Get filter value
                const filterValue = this.getAttribute('data-filter');
                
                // Filter photo cards
                photoCards.forEach(card => {
                    const category = card.getAttribute('data-cat');
                    
                    if (filterValue === 'all' || category === filterValue) {
                        card.style.display = '';
                    } else {
                        card.style.display = 'none';
                    }
                });

                // Update visible cards array
                visibleCards = Array.from(document.querySelectorAll('.photo-card')).filter(c => c.style.display !== 'none');
            });
        });
    </script>
