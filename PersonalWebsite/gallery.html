<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Carlo — Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/css.ss" />
</head>
<body class="gallery-page">

  <a class="home-fab" href="index.html" title="Back home">
    <i class="bi bi-house-door-fill"></i>
  </a>

  <main class="gallery-wrap container">
    <h1 class="gallery-title">Gallery</h1>

    <div class="gallery-controls">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="me">Me</button>
      <button class="filter-btn" data-filter="friends">Friends</button>
      <button class="filter-btn" data-filter="random">Random</button>
    </div>

    <div class="photo-grid" id="photoGrid">
      <!-- we use same image multiple times (your request) -->
      <div class="photo-card" data-cat="me"><img src="JPG/MyProfile.jpg" alt="MyProfile"></div>
      <div class="photo-card" data-cat="friends"><img src="JPG/MyProfile.jpg" alt="MyProfile"></div>
      <div class="photo-card" data-cat="random"><img src="JPG/MyProfile.jpg" alt="MyProfile"></div>
      <div class="photo-card" data-cat="me"><img src="JPG/MyProfile.jpg" alt="MyProfile"></div>
      <div class="photo-card" data-cat="friends"><img src="JPG/MyProfile.jpg" alt="MyProfile"></div>
      <div class="photo-card" data-cat="random"><img src="JPG/MyProfile.jpg" alt="MyProfile"></div>
    </div>
  </main>

  <div id="imgModal" class="img-modal">
    <button class="modal-close" aria-label="close">&times;</button>
    <button class="modal-nav modal-prev" aria-label="prev"><i class="bi bi-chevron-left"></i></button>
    <img id="modalImg" src="" alt="">
    <button class="modal-nav modal-next" aria-label="next"><i class="bi bi-chevron-right"></i></button>
  </div>

<script>
  const cards = Array.from(document.querySelectorAll('.photo-card'));
  const modal = document.getElementById('imgModal');
  const modalImg = document.getElementById('modalImg');
  const closeBtn = modal.querySelector('.modal-close');
  const nextBtn = modal.querySelector('.modal-next');
  const prevBtn = modal.querySelector('.modal-prev');
  let currentIndex = 0;

  function openModal(i){
    currentIndex = i;
    modalImg.src = cards[i].querySelector('img').src;
    modal.classList.add('open');
  }
  function closeModal(){ modal.classList.remove('open'); }
  function next(){ openModal((currentIndex + 1) % cards.length); }
  function prev(){ openModal((currentIndex - 1 + cards.length) % cards.length); }

  cards.forEach((c, i) => c.addEventListener('click', () => openModal(i)));
  closeBtn.addEventListener('click', closeModal);
  nextBtn.addEventListener('click', next);
  prevBtn.addEventListener('click', prev);
  document.addEventListener('keydown', (e) => {
    if(!modal.classList.contains('open')) return;
    if(e.key === 'ArrowRight') next();
    if(e.key === 'ArrowLeft') prev();
    if(e.key === 'Escape') closeModal();
  });

  document.querySelectorAll('.filter-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f = b.dataset.filter;
      cards.forEach(c => {
        c.style.display = (f === 'all' || c.dataset.cat === f) ? '' : 'none';
      });
    });
  });
</script>

</body>
</html>
